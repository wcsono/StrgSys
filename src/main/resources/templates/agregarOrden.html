<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Nueva Orden')}"></head>
<body>

<!-- Navegación principal -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<div class="container">
    <div class="text-center my-4">
        <h3>Nueva Orden</h3>
    </div>

    <!-- Formulario principal -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form th:action="@{/guardarAgregarOrden}" th:object="${ordenForma}" method="post">

                <!-- Código Cliente -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Código (DNI/RUC)</span>
                    <input id="codCli" name="codCli" class="form-control"
                           style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase();" required>
                </div>

                <!-- Nombre Cliente -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Nombre</span>
                    <input id="nomCli" name="nomCli" class="form-control" readonly>
                </div>

                <!-- Dirección Cliente -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Dirección</span>
                    <input id="dirCli" name="dirCli" class="form-control" readonly>
                </div>

                <!-- Tipo Documento -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Tipo Documento</span>
                    <select th:field="*{tipoDocumento.idTd}" class="form-select" required>
                        <option value="" selected>Seleccione</option>
                        <option th:each="td : ${tdsAgregarOrden}"
                                th:value="${td.idTd}"
                                th:text="${td.codTd}">
                        </option>
                    </select>
                </div>

                <!-- Fecha Orden -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Fecha Registro</span>
                    <input type="date" th:field="*{fecOrd}" class="form-control" required>
                </div>

                <!-- Documento Referencia -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Documento Referencia</span>
                    <input th:field="*{ndocRef}" class="form-control"
                           style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase();">
                </div>

                <!-- Estado y costo ocultos -->
                <input type="hidden" th:field="*{estOrd}" value="0"/>
                <input type="hidden" th:field="*{cosOrd}" value="0"/>

                <!-- Botones -->
                <div class="text-center">
                    <button id="btnAgregar" type="submit" class="btn btn-primary btn-sm me-3">
                        <i class="bi bi-database-add me-1"></i>Agregar
                    </button>
                    <a th:href="@{/ordenes}" class="btn btn-secondary btn-sm">
                        <i class="bi bi-arrow-return-left me-1"></i>Regresar
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- 🔹 Aquí incluimos el fragmento del modal -->
<div th:replace="~{fragmentos/agregarClienteModal :: modalAgregarCliente}"></div>

<!-- Script externo -->
<script th:src="@{/js/agregarOrden.js}"></script>

<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

</body>
</html>
