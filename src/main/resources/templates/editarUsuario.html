<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Editar Usuario')}"></head>
<body>
<!-- Menu de Navegacion -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}"></div>

<div class="container">
    <div class="row text-center" style="margin:30px">
        <div class="col-8">
            <h3>Editar Usuario</h3>
            <div class="container" style="margin:30px">
                <form action="/guardarEditarUsuario" th:object="${usuarioEditar}" method="post">
                    <!-- ID oculto -->
                    <input type="hidden" th:field="*{idUsuario}" id="idUsuario" name="idUsuario"/>

                    <!-- Nombre -->
                    <div class="input-group mb-3">
                        <span class="input-group-text">Nombre</span>
                        <input type="text" th:field="*{nombre}" id="nombre" class="form-control"
                               autocomplete="on" onfocus="this.select()" required
                               style="text-transform: uppercase;"
                               oninput="this.value = this.value.toUpperCase();">
                    </div>

                    <!-- Usuario -->
                    <div class="input-group mb-3">
                        <span class="input-group-text">Usuario</span>
                        <input type="text" th:field="*{user}" id="user" class="form-control"
                               autocomplete="on" onfocus="this.select()" required>
                    </div>

                    <!-- Password -->
                    <small class="form-text text-muted">
                        Deje este campo vacío si no desea cambiar la contraseña.
                    </small>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Password</span>
                        <input type="password" th:field="*{password}" id="password" class="form-control" required>
                    </div>


                    <!-- Nivel de Acceso -->
                    <div class="input-group mb-3">
                        <span class="input-group-text">Nivel de Acceso</span>
                        <select th:field="*{nivelAcceso}" id="nivelAcceso" class="form-select" required>
                            <option value="">Seleccione un nivel</option>
                            <option value="1">Administrador</option>
                            <option value="2">Operador</option>
                            <option value="3">Almacén</option>
                        </select>
                    </div>

                    <!-- Estatus -->
                    <div class="input-group mb-3">
                        <span class="input-group-text">Estatus</span>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{estUsuario}" id="activo" value="1"/>
                            <label class="form-check-label fw-bold" for="activo">Activo</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{estUsuario}" id="inactivo" value="0"/>
                            <label class="form-check-label fw-bold" for="inactivo">Inactivo</label>
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="mb-1 d-flex justify-content-center mt-4">
                        <button type="submit" id="btnGuardarUsuario" class="btn btn-primary btn-sm me-4">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                        <a href="/usuarios" class="btn btn-secondary btn-sm">Regresar</a>
                    </div>

                    <!-- Mensajes -->
                    <div th:if="${mensajeError}" class="alert alert-danger mt-2" th:text="${mensajeError}"></div>
                    <div th:if="${mensajeExito}" class="alert alert-success mt-2" th:text="${mensajeExito}"></div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>
<script th:src="@{/js/usuario.js}"></script>

</body>
</html>
