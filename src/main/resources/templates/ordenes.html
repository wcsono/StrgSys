<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Órdenes')}"></head>
<body>

<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<div class="container-fluid mt-4">
    <div th:replace="~{fragmentos/alertas :: alertas-seccion}"></div>

    <div class="row">
        <!-- Panel izquierdo -->
        <div class="col-md-7 tabla-ordenes">
            <h3 class="text-primary text-center">Listado de Órdenes</h3>
            <table class="table table-striped table-sm">
                <thead class="table-primary text-center">
                <tr>
                    <th>N.Orden</th>
                    <th>Cliente</th>
                    <th>Fecha Ing</th>
                    <th>Usuario</th>
                    <th>Estado</th>
                    <th>Fecha Est</th>
                    <th>Costo</th>
                    <th>T.Doc.</th>
                    <th>
                        <!-- Botones de búsqueda y agregar -->
                        <div class="d-flex flex-column align-items-center gap-2">
                            <button class="btn btn-outline-primary btn-sm d-flex align-items-center justify-content-center"
                                    type="button" data-bs-toggle="offcanvas" data-bs-target="#filtroArticulosOffcanvas">
                                <i class="bi bi-binoculars me-1"></i> Buscar
                            </button>
                            <a href="/agregarOrden"
                               class="btn btn-sm btn-primary rounded d-flex align-items-center justify-content-center"
                               style="white-space: nowrap;">
                                <i class="bi bi-file-earmark-plus me-1"></i> Nva. Orden
                            </a>
                        </div>

                    </th>
                </tr>
                </thead>

                <tbody th:if="${#lists.isEmpty(listadoOrdenes)}">
                <tr>
                    <td colspan="9" class="text-center text-muted">No se encontraron órdenes.</td>
                </tr>
                </tbody>

                <tbody th:unless="${#lists.isEmpty(listadoOrdenes)}">
                <tr th:each="orden : ${listadoOrdenes}"
                    th:id="'fila-orden-' + ${orden.idOrd}"
                    class="text-center">

                    <td th:text="${orden.numOrd}"></td>
                    <td th:text="${orden.cliente.nomCli}"></td>
                    <td th:text="${#temporals.format(orden.fecOrd,'dd/MM/yyyy')}"></td>
                    <td class="col-usuario" th:text="${orden.usuario.nombre}"></td>
                    <td class="col-estado">
                        <span th:text="${orden.estOrd.descripcion}"
                              th:class="${orden.estOrd.cssClass}"></span>
                    </td>
                    <td class="col-fechaEstado"
                        th:text="${orden.fechaEstado != null ? #temporals.format(orden.fechaEstado,'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td th:text="${orden.cosOrd}"></td>
                    <td th:text="${orden.tipoDocumento.codTd}"></td>

                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <!-- Botón Ver -->
                            <button class="btn btn-info btn-sm ver-orden"
                                    th:attr="data-id=${orden.idOrd}" title="Ver">
                                <i class="bi bi-eye"></i>
                            </button>

                            <!-- Botón Editar -->
                            <a th:href="@{/orden/editar/{idOrd}(idOrd=${orden.idOrd})}"
                               class="btn btn-dark btn-sm" title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <!-- Botón Eliminar/Anular (POST) -->
                            <form th:action="@{/orden/{id}/eliminarOAnular(id=${orden.idOrd})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-danger btn-sm" title="Eliminar / Anular">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Panel derecho -->
        <div class="col-md-5 panel-derecho" id="detallePanel">
            <div id="alertContainer"></div>
            <div id="detalleContenido" class="mt-0 fade-in"></div>
        </div>
    </div>
</div>

<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

<script th:src="@{/js/orden.js}"></script>
</body>
</html>
