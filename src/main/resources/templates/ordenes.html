<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Órdenes')}"></head>
<body>

<!-- Navegación principal -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<!-- Contenido principal -->
<div class="container-fluid mt-4">

    <!-- Mensajes de éxito / error -->
    <div th:replace="~{fragmentos/alertas :: alertas-seccion}"></div>

    <div class="row">
        <!-- Panel izquierdo: listado de órdenes -->
        <div class="col-md-7 tabla-ordenes">
            <h3 class="text-primary text-center">Listado de Órdenes</h3>
            <table class="table table-striped table-sm">
                <thead class="table-primary text-center">
                <tr>
                    <th>N.Orden</th>
                    <th>Cliente</th>
                    <th>Fecha Ing</th> <!-- ✅ cambiado -->
                    <th>Usuario</th>
                    <th>Estado</th>
                    <th>Fecha Est</th> <!-- ✅ nueva columna -->
                    <th>Costo</th>
                    <th>T.Doc.</th>


                    <th>
                        <!-- Botones de búsqueda y agregar -->
                        <div class="d-flex flex-column align-items-center gap-2">
                            <button class="btn btn-outline-primary btn-sm d-flex align-items-center justify-content-center"
                                    type="button" data-bs-toggle="offcanvas" data-bs-target="#filtroOffcanvas">
                                <i class="bi bi-binoculars me-1"></i> Buscar
                            </button>
                            <a href="/agregarOrden"
                               class="btn btn-sm btn-primary rounded d-flex align-items-center justify-content-center"
                               style="white-space: nowrap;">
                                <i class="bi bi-file-earmark-plus me-1"></i> Agregar
                            </a>
                        </div>
                    </th>
                </tr>
                </thead>

                <!-- Si no hay órdenes -->
                <tbody th:if="${#lists.isEmpty(listadoOrdenes)}">
                <tr>
                    <td colspan="9" class="text-center text-muted">
                        No se encontraron órdenes.
                    </td>
                </tr>
                </tbody>

                <!-- Si hay órdenes -->
                <tbody th:unless="${#lists.isEmpty(listadoOrdenes)}">
                <tr th:each="orden : ${listadoOrdenes}" class="text-center">
                    <td th:text="${orden.numOrd}"></td>
                    <td th:text="${orden.cliente.nomCli}"></td>
                    <td th:text="${#temporals.format(orden.fecOrd,'dd/MM/yyyy')}"></td>
                    <td th:text="${orden.usuario.nombre}"></td>
                    <td>
                        <!-- Estado con nombre y color desde enum -->
                        <span th:text="${orden.estOrd.descripcion}"
                              th:class="${orden.estOrd.cssClass}"></span>
                    </td>
                    <td th:text="${orden.fechaEstado != null ? #temporals.format(orden.fechaEstado,'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td th:text="${orden.cosOrd}"></td>
                    <td th:text="${orden.tipoDocumento.codTd}"></td>

                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-info btn-sm ver-orden"
                                    th:attr="data-id=${orden.idOrd}" title="Ver">
                                <i class="bi bi-eye"></i>
                            </button>
                            <a th:href="@{/orden/editar/{idOrd}(idOrd=${orden.idOrd})}"
                               class="btn btn-dark btn-sm" title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/eliminarOrd/{id}(id=${orden.idOrd})}"
                               class="btn btn-danger btn-sm" title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Paginación -->
            <nav>
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${paginaOrdenes.number == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/ordenes(page=${paginaOrdenes.number-1})}">Anterior</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, paginaOrdenes.totalPages-1)}"
                        th:classappend="${i == paginaOrdenes.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/ordenes(page=${i})}" th:text="${i+1}"></a>
                    </li>
                    <li class="page-item"
                        th:classappend="${paginaOrdenes.number == paginaOrdenes.totalPages-1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/ordenes(page=${paginaOrdenes.number+1})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Panel derecho: detalle de la orden -->
        <div class="col-md-5 panel-derecho" id="detallePanel">
            <div id="alertContainer"></div>
            <div id="detalleContenido" class="mt-0 fade-in">
                <!-- Aquí se inyecta el detalle con orden.js -->
            </div>
        </div>
    </div>
</div> <!-- cierre container-fluid -->

<!-- Offcanvas lateral derecho -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="filtroOffcanvas">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Filtros de Órdenes</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <form th:action="@{/ordenes}" method="get" class="d-flex flex-column gap-3">
            <div class="input-group mb-1">
                <span class="input-group-text">N.Orden</span>
                <input id="numOrd" name="numOrd" class="form-control">
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">ID Cliente</span>
                <input id="idCliente" name="idCliente" class="form-control" type="number">
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">Fecha desde</span>
                <input type="date" id="fecOrdDesde" name="fecOrdDesde" class="form-control">
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">Fecha hasta</span>
                <input type="date" id="fecOrdHasta" name="fecOrdHasta" class="form-control">
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">Estado</span>
                <select id="estOrd" name="estOrd" class="form-select">
                    <option value="">-- Seleccionar --</option>
                    <!-- Opciones dinámicas desde enum -->
                    <option th:each="estado : ${T(wcsono.strgSys.enums.EstadoOrden).values()}"
                            th:value="${estado.codigo}"
                            th:text="${estado.descripcion}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary mt-2">
                <i class="bi bi-search"></i> Aplicar Filtros
            </button>
        </form>
    </div>
</div>

<!-- Pie de página -->
<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

<!-- Scripts -->
<script th:src="@{/js/orden.js}"></script>
</body>
</html>
