<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Órdenes')}"></head>
<body>

<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<div class="container-fluid mt-4">
    <div th:replace="~{fragmentos/alertas :: alertas-seccion}"></div>

    <div class="row">
        <!-- Panel izquierdo -->
        <div class="col-md-7 tabla-ordenes">
            <h3 class="text-primary text-center">Listado de Órdenes</h3>
            <table class="table table-sm">
                <thead class="table-primary text-center">
                <tr>
                    <th>N.Orden</th>
                    <th>Cliente</th>
                    <th>Fecha Ing</th>
                    <th>Usuario</th>
                    <th>Estado</th>
                    <th>Fecha Est</th>
                    <th>Costo</th>
                    <th>T.Doc.</th>
                    <th>
                        <!-- Botones de búsqueda y agregar -->
                        <div class="d-flex flex-column align-items-center gap-2">
                            <button class="btn btn-outline-primary btn-sm d-flex align-items-center justify-content-center"
                                    type="button" data-bs-toggle="offcanvas" data-bs-target="#filtroArticulosOffcanvas">
                                <i class="bi bi-binoculars me-1"></i> Buscar
                            </button>
                            <a href="/agregarOrden"
                               class="btn btn-sm btn-primary rounded d-flex align-items-center justify-content-center"
                               style="white-space: nowrap;">
                                <i class="bi bi-file-earmark-plus me-1"></i> Nva. Orden
                            </a>
                        </div>

                    </th>
                </tr>
                </thead>

                <tbody th:if="${#lists.isEmpty(listadoOrdenes)}">
                <tr>
                    <td colspan="9" class="text-center text-muted">No se encontraron órdenes.</td>
                </tr>
                </tbody>

                <tbody th:unless="${#lists.isEmpty(listadoOrdenes)}">
                <tr th:each="orden : ${listadoOrdenes}"
                    th:id="'fila-orden-' + ${orden.idOrd}"
                    th:class="'text-center ' + ${orden.estOrd.rowClass}">


                <td th:text="${orden.numOrd}"></td>
                    <td th:text="${orden.cliente.nomCli}"></td>
                    <td th:text="${#temporals.format(orden.fecOrd,'dd/MM/yyyy')}"></td>
                    <td class="col-usuario" th:text="${orden.usuario.nombre}"></td>
                    <td class="col-estado">
                        <span th:text="${orden.estOrd.descripcion}"
                              th:class="${orden.estOrd.cssClass}"></span>
                    </td>
                    <td class="col-fechaEstado"
                        th:text="${orden.fechaEstado != null ? #temporals.format(orden.fechaEstado,'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td th:text="${orden.cosOrd}"></td>
                    <td th:text="${orden.tipoDocumento.codTd}"></td>

                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <!-- Botón Ver -->
                            <button class="btn btn-info btn-sm ver-orden"
                                    th:attr="data-id=${orden.idOrd}" title="Ver">
                                <i class="bi bi-eye"></i>
                            </button>

                            <!-- Botón Editar -->
                            <a th:href="@{/orden/editar/{idOrd}(idOrd=${orden.idOrd})}"
                               class="btn btn-dark btn-sm" title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <!-- Botón Eliminar/Anular (POST) -->
                            <form th:action="@{/orden/{id}/eliminarOAnular(id=${orden.idOrd})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-danger btn-sm" title="Eliminar / Anular">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Paginación -->
            <div class="d-flex justify-content-center mt-3">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm">
                        <!-- Botón Anterior -->
                        <li class="page-item" th:classappend="${paginaOrdenes.first}? 'disabled'">
                            <a class="page-link"
                               th:href="@{/ordenes(page=${paginaOrdenes.number - 1},
                                       size=${paginaOrdenes.size},
                                       numOrd=${param.numOrd},
                                       nomCli=${param.nomCli},
                                       fecOrdDesde=${param.fecOrdDesde},
                                       fecOrdHasta=${param.fecOrdHasta},
                                       estOrd=${param.estOrd})}">
                                Anterior
                            </a>
                        </li>

                        <!-- Números de página -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, paginaOrdenes.totalPages - 1)}"
                            th:classappend="${i == paginaOrdenes.number}? 'active'">
                            <a class="page-link"
                               th:href="@{/ordenes(page=${i},
                                       size=${paginaOrdenes.size},
                                       numOrd=${param.numOrd},
                                       nomCli=${param.nomCli},
                                       fecOrdDesde=${param.fecOrdDesde},
                                       fecOrdHasta=${param.fecOrdHasta},
                                       estOrd=${param.estOrd})}"
                               th:text="${i + 1}">
                            </a>
                        </li>

                        <!-- Botón Siguiente -->
                        <li class="page-item" th:classappend="${paginaOrdenes.last}? 'disabled'">
                            <a class="page-link"
                               th:href="@{/ordenes(page=${paginaOrdenes.number + 1},
                                       size=${paginaOrdenes.size},
                                       numOrd=${param.numOrd},
                                       nomCli=${param.nomCli},
                                       fecOrdDesde=${param.fecOrdDesde},
                                       fecOrdHasta=${param.fecOrdHasta},
                                       estOrd=${param.estOrd})}">
                                Siguiente
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>


        </div>

        <!-- Panel derecho -->
        <div class="col-md-5 panel-derecho" id="detallePanel">
            <div id="alertContainer"></div>
            <div id="detalleContenido" class="mt-0 fade-in"></div>
        </div>
    </div>
</div>

<!-- Offcanvas de filtros -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="filtroArticulosOffcanvas" aria-labelledby="filtroLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="filtroLabel">Filtros de Órdenes</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
        <form th:action="@{/ordenes}" method="get" class="d-flex flex-column gap-3">

            <!-- Número de Orden -->
            <div class="input-group">
                <span class="input-group-text">N.Orden</span>
                <input id="numOrd" name="numOrd" class="form-control" placeholder="Ej: 1025">
            </div>

            <!-- Nombre Cliente -->
            <div class="input-group">
                <span class="input-group-text">Cliente</span>
                <input type="text" id="nomCli" name="nomCli" class="form-control" placeholder="Nombre del cliente"
                       style="text-transform: uppercase;"
                       oninput="this.value = this.value.toUpperCase();">

            </div>

            <!-- Estado -->
            <div class="input-group">
                <span class="input-group-text">Estado</span>
                <select id="estOrd" name="estOrd" class="form-select">
                    <option value="">-- Seleccionar --</option>
                    <option th:each="estado : ${T(wcsono.strgSys.enums.EstadoOrden).values()}"
                            th:value="${estado.codigo}"
                            th:text="${estado.descripcion}"></option>
                </select>
            </div>

            <!-- Documento de Referencia -->
            <div class="input-group">
                <span class="input-group-text">DocRef</span>
                <input id="docRef" name="docRef" class="form-control" placeholder="Referencia">
            </div>

            <!-- Tipo Documento -->
            <div class="input-group">
                <span class="input-group-text">Tipo Doc</span>
                <select id="tipoDoc" name="tipoDoc" class="form-select">
                    <option value="">-- Seleccionar --</option>
                    <option th:each="td : ${tdsAgregarOrden}"
                            th:value="${td.idTd}"
                            th:text="${td.desTd}"></option>
                </select>
            </div>

            <!-- Rango de fechas -->
            <div class="input-group">
                <span class="input-group-text">Fecha desde</span>
                <input type="date" id="fecOrdDesde" name="fecOrdDesde" class="form-control">
            </div>
            <div class="input-group">
                <span class="input-group-text">Fecha hasta</span>
                <input type="date" id="fecOrdHasta" name="fecOrdHasta" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary mt-2">
                <i class="bi bi-search"></i> Aplicar Filtros
            </button>
        </form>
    </div>
</div>

<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

<script th:src="@{/js/orden.js}"></script>
</body>
</html>
