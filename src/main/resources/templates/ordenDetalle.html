<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='ordenDetalle')}"></head>
<body>

<!-- Navegación principal -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<div class="container mt-4">
    <div class="text-center mb-4">
        <h3>Detalle de la Orden</h3>
    </div>

    <div class="row">
        <!-- Columna izquierda: Datos de la orden -->
        <div class="col-md-5">
            <h5>Datos de la Orden</h5>
            <table class="table table-bordered">
                <tr><th>ID Orden</th><td th:text="${orden.idOrd}"></td></tr>
                <tr><th>Número Orden</th><td th:text="${orden.numOrd}"></td></tr>
                <tr><th>Cliente/Proveedor</th><td th:text="${orden.cliente.nomCli}"></td></tr>
                <tr><th>Tipo Documento</th><td th:text="${orden.tipoDocumento.desTd}"></td></tr>
                <tr><th>Fecha Registro</th><td th:text="${#temporals.format(orden.fecOrd,'dd/MM/yyyy')}"></td></tr>
                <tr><th>Documento Referencia</th><td th:text="${orden.ndocRef}"></td></tr>

                <!-- 🔹 Nuevas filas -->
                <tr>
                    <th>Estado</th>
                    <td th:text="${orden.estOrd.descripcion}"></td>
                </tr>
                <tr>
                    <th>Fecha Estado</th>
                    <td th:text="${orden.fechaEstado != null ? #temporals.format(orden.fechaEstado,'dd/MM/yyyy HH:mm') : '—'}"></td>
                </tr>
                <tr>
                    <th>Usuario</th>
                    <td th:text="${orden.usuario != null ? orden.usuario.nombre : '—'}"></td>
                </tr>
            </table>

            <!-- Botones debajo de los datos -->
            <div class="d-flex justify-content-center gap-3 mt-3">
                <!-- Botón agregar artículos (siempre habilitado) -->
                <button class="btn btn-success" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#offcanvasArticulos">
                    <i class="bi bi-plus-circle me-1"></i> Agregar Artículos
                </button>

                <!-- Botón regresar al listado -->
                <a th:href="@{/ordenes}" class="btn btn-secondary">
                    <i class="bi bi-arrow-return-left me-1"></i> Regresar al listado
                </a>
            </div>
        </div>

        <!-- Columna derecha: Tabla de artículos -->
        <div class="col-md-7">
            <h5 class="text-center">Artículos en la Orden</h5>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                </tr>
                </thead>

                <!-- Fragmento de la tabla -->
                <tbody id="tablaArticulos" th:fragment="tablaArticulos">
                <tr th:each="detalle : ${detalleOrdenes}" th:if="${#lists.size(detalleOrdenes) > 0}">
                    <td th:text="${detalle.articulo.codArt}"></td>
                    <td th:text="${detalle.articulo.desArt}"></td>
                    <td th:text="${detalle.cantidad}"></td>
                    <td th:text="${detalle.cosArt}"></td>
                    <td th:text="${detalle.subtotal}"></td>
                </tr>
                <tr th:unless="${#lists.size(detalleOrdenes) > 0}">
                    <td colspan="5" class="text-center text-muted">No hay Artículos agregados</td>
                </tr>
                </tbody>

                <!-- Fragmento del total -->
                <tfoot id="totalOrdenFragment" th:fragment="totalOrdenFragment">
                <tr>
                    <td colspan="5">
                        <div class="card bg-success text-white">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Total Orden:</h5>
                                <h4 class="mb-0">
                                    <span th:text="${#numbers.formatDecimal(totalOrden, 1, 'COMMA', 2, 'POINT')}"></span>
                                </h4>
                            </div>
                        </div>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<!-- Fragmento de offcanvas-articulos -->
<div th:replace="fragmentos/offcanvas-articulos :: offcanvas-articulos-seccion"></div>

<!-- Pie de página -->
<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

<script th:src="@{/js/offcanvas-articulos.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var ordenId = [[${orden.idOrd}]];
    var tipoMovimiento = /*[[${orden.tipoDocumento.tipoMovimiento}]]*/ "";
    console.log("tipoMovimiento:", tipoMovimiento);
    /*]]>*/
</script>


</body>
</html>
