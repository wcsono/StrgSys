<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Editar Orden')}"></head>
<body th:data-estado-orden="${orden.estOrd}">

<!-- Navegación principal -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<div class="container mt-4">
    <div class="text-center mb-4">
        <h3>Edición de la Orden</h3>
    </div>

    <div class="row">
        <!-- Columna izquierda: Datos de la orden -->
        <div class="col-md-5">
            <h5 class="text-center text-primary mb-2">Datos de la Orden</h5>
            <form th:action="@{/orden/guardarEdicion}" method="post">
                <input type="hidden" th:value="${orden.idOrd}" name="idOrd"/>

                <!-- Número de Orden -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Número Orden</span>
                    <input type="text" class="form-control" name="numOrd"
                           th:value="${orden.numOrd}" readonly>
                </div>

                <!-- Código Cliente -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Código Cliente</span>
                    <input type="text" class="form-control" id="codCli" name="codCli"
                           th:value="${orden.cliente != null ? orden.cliente.codCli : ''}">
                </div>

                <!-- Cliente -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Cliente/Proveedor</span>
                    <input type="text" class="form-control" id="nomCli"
                           th:value="${orden.cliente != null ? orden.cliente.nomCli : ''}" readonly>
                </div>

                <!-- Tipo Documento -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Tipo Documento</span>
                    <select class="form-select" name="tipoDocumento.idTd">
                        <option th:each="td : ${tds}"
                                th:value="${td.idTd}"
                                th:text="${td.codTd}"
                                th:selected="${orden.tipoDocumento != null and td.idTd == orden.tipoDocumento.idTd}">
                        </option>
                    </select>
                </div>

                <!-- Fecha Registro -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Fecha Registro</span>
                    <input type="date" class="form-control" name="fecOrd"
                           th:value="${#temporals.format(orden.fecOrd,'yyyy-MM-dd')}">
                </div>

                <!-- Documento Referencia -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Documento Referencia</span>
                    <input type="text" class="form-control" name="ndocRef"
                           th:value="${orden.ndocRef}" style="text-transform: uppercase;">
                </div>

                <!-- Footer con botones alineados -->
                <div class="d-flex justify-content-center flex-wrap gap-2 mt-3">
                    <!-- Botón Guardar Cambios -->
                    <button id="btnGuardar" type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i> Guardar Cambios
                    </button>

                    <!-- Menú drop-up dinámico -->
                    <div class="dropup">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="accionesMenu"
                                data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-gear-fill me-1"></i> Acciones
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="accionesMenu">
                            <!-- JS insertará aquí los botones según estado -->
                        </ul>
                    </div>
                </div>
            </form>
        </div>

        <!-- Columna derecha: Tabla de artículos -->
        <div class="col-md-7">
            <h5 class="text-center text-primary mb-2">Artículos en la Orden</h5>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                </tr>
                </thead>

                <tbody id="tablaArticulos" th:fragment="tablaArticulos">
                <tr th:each="detalle : ${orden.detalles}" th:if="${#lists.size(orden.detalles) > 0}">
                    <td th:text="${detalle.articulo.codArt}"></td>
                    <td th:text="${detalle.articulo.desArt}"></td>
                    <td th:text="${detalle.cantidad}"></td>
                    <td th:text="${detalle.cosArt}"></td>
                    <td th:text="${detalle.subtotal}"></td>
                </tr>
                <tr th:unless="${#lists.size(orden.detalles) > 0}">
                    <td colspan="5" class="text-center text-muted">No hay Artículos agregados</td>
                </tr>
                </tbody>

                <tfoot id="totalOrdenFragment" th:fragment="totalOrdenFragment">
                <tr>
                    <td colspan="5">
                        <div class="card bg-success text-white">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Total Orden:</h5>
                                <h4 class="mb-0">
                                    <span th:text="${#numbers.formatDecimal(orden.cosOrd, 1, 'COMMA', 2, 'POINT')}"></span>
                                </h4>
                            </div>
                        </div>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<!-- Panel lateral offcanvas-articulos -->
<div th:replace="fragmentos/offcanvas-articulos :: offcanvas-articulos-seccion"></div>

<!-- Pie de página -->
<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

<!-- Scripts -->
<script src="/js/offcanvas-articulos.js" defer></script>
<script src="/js/editarOrd.js" defer></script>
</body>
</html>
