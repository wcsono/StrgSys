<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Editar Orden')}"></head>
<body th:data-estado-orden="${orden.estOrd}" th:data-tipo-orden="${orden.tipoDocumento.tipoMovimiento}">

<!-- Navegación principal -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<div class="container mt-4">
    <div class="text-center mb-4">
        <h3>Edición de la Orden</h3>
    </div>

    <div class="row">
        <!-- Columna izquierda: Datos de la orden -->
        <div class="col-md-5">
            <h5 class="text-center text-primary mb-2">Datos de la Orden</h5>
            <form th:action="@{/orden/guardarEdicion}" method="post">
                <input type="hidden" th:value="${orden.idOrd}" name="idOrd"/>

                <!-- Número de Orden -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Número Orden</span>
                    <input type="text" class="form-control" name="numOrd"
                           th:value="${orden.numOrd}" readonly>
                </div>

                <!-- Código Cliente -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Código Cliente</span>
                    <input type="text" class="form-control" id="codCli" name="codCli"
                           th:value="${orden.cliente != null ? orden.cliente.codCli : ''}">
                </div>

                <!-- Cliente -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Cliente/Proveedor</span>
                    <input type="text" class="form-control" id="nomCli"
                           th:value="${orden.cliente != null ? orden.cliente.nomCli : ''}" readonly>
                </div>

                <!-- Tipo Documento -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Tipo Documento</span>
                    <select class="form-select" name="tipoDocumento.idTd">
                        <option th:each="td : ${tds}"
                                th:value="${td.idTd}"
                                th:text="${td.codTd}"
                                th:selected="${orden.tipoDocumento != null and td.idTd == orden.tipoDocumento.idTd}">
                        </option>
                    </select>
                </div>

                <!-- Fecha Registro -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Fecha Registro</span>
                    <input type="date" class="form-control" name="fecOrd"
                           th:value="${#temporals.format(orden.fecOrd,'yyyy-MM-dd')}">
                </div>

                <!-- Documento Referencia -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Documento Referencia</span>
                    <input type="text" class="form-control" name="ndocRef"
                           th:value="${orden.ndocRef}" style="text-transform: uppercase;">
                </div>

                <!-- Botones dentro del formulario -->
                <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
                    <button id="btnGuardar" type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-save me-1 fs-6"></i> Guardar
                    </button>

                    <a href="/ordenes" class="btn btn-secondary btn-sm">
                        <i class="bi bi-arrow-left-circle me-1 fs-6"></i> Regresar
                    </a>
                </div>
            </form>

            <!-- Bloque Acciones fuera del formulario pero dentro de la misma columna -->
            <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
                <div class="dropup">
                    <button class="btn btn-dark btn-sm dropdown-toggle" type="button" id="accionesMenuBtn"
                            data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-gear-fill me-1 fs-6"></i> Acciones
                    </button>
                    <ul class="dropdown-menu" id="accionesMenu" aria-labelledby="accionesMenuBtn">
                        <!-- Aquí se insertan dinámicamente los enlaces -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Columna derecha: Tabla de artículos -->
        <div class="col-md-7">
            <h5 class="text-center text-primary mb-2">Artículos en la Orden</h5>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                </tr>
                </thead>

                <tbody id="tablaArticulos" th:fragment="tablaArticulos">
                <tr th:each="detalle : ${orden.detalles}" th:if="${#lists.size(orden.detalles) > 0}">
                    <td th:text="${detalle.articulo.codArt}"></td>
                    <td th:text="${detalle.articulo.desArt}"></td>
                    <td th:text="${detalle.cantidad}"></td>
                    <td th:text="${detalle.cosArt}"></td>
                    <td th:text="${detalle.subtotal}"></td>
                </tr>
                <tr th:unless="${#lists.size(orden.detalles) > 0}">
                    <td colspan="5" class="text-center text-muted">No hay Artículos agregados</td>
                </tr>
                </tbody>

                <tfoot id="totalOrdenFragment" th:fragment="totalOrdenFragment">
                <tr>
                    <td colspan="5">
                        <div class="card bg-success text-white">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Total Orden:</h5>
                                <h4 class="mb-0">
                                    <span th:text="${#numbers.formatDecimal(orden.cosOrd, 1, 'COMMA', 2, 'POINT')}"></span>
                                </h4>
                            </div>
                        </div>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<!-- Panel lateral offcanvas-articulos -->
<div th:insert="~{fragmentos/offcanvas-articulos :: offcanvas-articulos-seccion}"></div>

<!-- Pie de página -->
<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

<!-- Modal Facturar -->
<div class="modal fade" id="facturarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/facturacion/facturar}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title text-center w-100">Facturar Orden</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="idOrd" th:value="${orden.idOrd}"/>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Número de Factura</span>
                        <input type="text" id="numFacturaModal" name="numFactura" class="form-control" required>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Monto</span>
                        <input type="number" id="montoFacturar" name="montoFacturar" class="form-control"
                               th:value="${orden.cosOrd}" readonly>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-save me-1"></i> Guardar
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Confirmación Entregar/Ingresar -->
<div class="modal fade" id="confirmarAccionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- 🔹 Formulario directo al endpoint entregadoIngresado -->
            <form th:action="@{/orden/entregadoIngresado/{idOrd}(idOrd=${orden.idOrd})}" method="post">
                <div class="modal-header">
                    <h5 id="confirmarAccionTitulo" class="modal-title text-center w-100"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="confirmarAccionMensaje"></p>
                    <!-- Campo oculto para la acción (ENTREGAR o INGRESAR) -->
                    <input type="hidden" id="accionHidden" name="accion" value=""/>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle me-1"></i> Aceptar
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Script para enfocar automáticamente el input Número de Factura -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var facturarModal = document.getElementById('facturarModal');
        facturarModal.addEventListener('shown.bs.modal', function () {
            document.getElementById('numFacturaModal').focus();
        });
    });
</script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var ordenId = [[${orden.idOrd}]];
    var tipoMovimiento = '[[${orden.tipoDocumento.tipoMovimiento}]]';
    /*]]>*/
</script>


<!-- Scripts -->
<script src="/js/offcanvas-articulos.js" defer></script>
<script src="/js/editarOrd.js" defer></script>
</body>
</html>
