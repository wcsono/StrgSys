<!-- fragmentos/agregarClienteModal.html -->
<div th:fragment="modalAgregarCliente">

    <!-- Modal de Alerta -->
    <div class="modal fade" id="modalClienteNoEncontrado" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Cliente no encontrado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p>Código mal ingresado o cliente no registrado. ¿Desea registrar?</p>
                </div>

                <div class="modal-footer">
                    <button id="btnAceptarRegistrar" type="button" class="btn btn-primary">Aceptar</button>
                    <a th:href="@{/ordenes}" class="btn btn-secondary">Cancelar</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal Agregar Cliente -->
    <div class="modal fade" id="modalAgregarCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Registrar Nuevo Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <!-- 🔹 Sin th:action, el JS intercepta el submit -->
                    <form id="formAgregarCliente" th:object="${clienteForma}" method="post" autocomplete="off">
                        <input type="hidden" th:field="*{estCliente}" value="0">

                        <div class="input-group mb-3">
                            <span class="input-group-text">Código (DNI/RUC)</span>
                            <input th:field="*{codCli}" class="form-control" required>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Nombre</span>
                            <input th:field="*{nomCli}" class="form-control" required
                                   oninput="this.value = this.value.toUpperCase();">
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Dirección</span>
                            <input th:field="*{dirCli}" class="form-control" required
                                   oninput="this.value = this.value.toUpperCase();">
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Email</span>
                            <input th:field="*{emailCli}" type="email" class="form-control">
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-sm me-3">
                                <i class="bi bi-person-plus me-1"></i>Guardar Cliente
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- 🔹 Toast de confirmación -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastClienteGuardado" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    ✅ Cliente registrado correctamente.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

</div>
