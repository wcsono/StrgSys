<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Tipos de Documento')}"></head>
<body>

<!-- Navegación principal -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<!-- Contenido principal -->
<div class="container mt-4">

    <!-- Mensaje de éxito -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Título -->
    <div class="row text-primary">
        <div class="col text-center">
            <h2>Tipos de Documentos</h2>
        </div>
    </div>

    <!-- Tabla de tipos de documento -->
    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped table-hover text-center align-middle">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Tipo Movimiento</th>
                    <th>Subtipo</th>
                    <th>Estado</th>
                    <th>
                        <a href="/agregarTipoDocumento" class="btn btn-sm btn-primary d-flex align-items-center justify-content-center">
                            <i class="bi bi-file-earmark-plus me-1"></i> Agregar
                        </a>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="td : ${tiposDocumentos}">
                    <td th:text="${td.idTd}"></td>
                    <td th:text="${td.codTd}"></td>
                    <td th:text="${td.desTd}"></td>
                    <td th:text="${td.tipoMovimiento}"></td>
                    <td th:text="${td.subTipoMovimiento}"></td>
                    <td>
                        <span th:text="${td.estTd ? 'Activo' : 'Inactivo'}"
                              th:classappend="${td.estTd} ? 'text-success' : 'text-danger'"></span>
                    </td>
                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <!-- Editar -->
                            <a th:href="@{/editarTd/{id}(id=${td.idTd})}"
                               class="btn btn-dark btn-sm" title="Editar registro">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <!-- Eliminar definitivo (opcional) -->
                            <a th:href="@{/eliminarTd/{id}(id=${td.idTd})}"
                               class="btn btn-danger btn-sm" title="Eliminar definitivamente">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/js/td.js}"></script>

<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

</body>
</html>
