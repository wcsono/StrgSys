<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Clientes')}"></head>
<body>

<!-- Navegación principal -->
<div th:replace="~{fragmentos/navegacion-principal::navegacion-principal-seccion}" th:remove="tag"></div>

<!-- Contenido principal -->
<div class="container mt-4">

    <!-- Mensaje de éxito -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Título y botón -->
    <div class="row text-primary mb-2">
        <div class="col-10 mx-auto d-flex justify-content-center align-items-center">
            <h2 class="mb-0 text-center">Clientes</h2>
        </div>
    </div>

    <!-- Tabla de clientes -->
    <div class="row d-flex mt-3">
        <div class="col-11 mx-auto mt-2"> <!-- ampliamos a col-11 -->
            <div class="table-responsive">
                <table class="table table-striped table-sm align-middle text-center">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Dirección</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>
                            <a href="/agregarCliente" class="btn btn-sm btn-primary rounded">
                                <i class="bi bi-person-plus"></i> Agregar
                            </a>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Mostrar mensaje si no hay clientes -->
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="8" class="text-center text-muted">
                            No hay clientes registrados para mostrar.
                        </td>
                    </tr>
                    <!-- Iterar clientes si existen -->
                    <tr th:each="cli : ${clientes}" class="text-center" th:unless="${#lists.isEmpty(clientes)}">
                        <td th:text="${cli.idCliente}"></td>
                        <td th:text="${cli.codCli}"></td>
                        <td th:text="${cli.nomCli}"></td>
                        <!-- Dirección truncada con tooltip -->
                        <td class="text-truncate" style="max-width: 200px;"
                            th:text="${cli.dirCli}"
                            th:title="${cli.dirCli}"></td>
                        <td th:text="${cli.emailCli}"></td>
                        <td th:text="${cli.telCli}"></td>
                        <td th:text="${cli.estCliente == 1 ? 'Activo' : 'Inactivo'}"></td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/editarCliente/{id}(id=${cli.idCliente})}"
                                   class="btn btn-dark btn-sm me-2"
                                   title="Editar cliente"
                                   data-bs-toggle="tooltip" data-bs-placement="top">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/eliminarCliente/{id}(id=${cli.idCliente})}"
                                   class="btn btn-danger btn-sm"
                                   title="Eliminar cliente"
                                   data-bs-toggle="tooltip" data-bs-placement="top">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/js/clientes.js}"></script>

<!-- Inicializar tooltips -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"], [title]'))
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        });
    });
</script>

<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>

</body>
</html>
